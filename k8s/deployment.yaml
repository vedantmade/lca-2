apiVersion: apps/v1
kind: Deployment
metadata:
  name: upiwhere-app
  labels:
    app: upiwhere-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: upiwhere-app
  template:
    metadata:
      labels:
        app: upiwhere-app
    spec:
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: upiwhere-app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
